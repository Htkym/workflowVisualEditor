name: Windows verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - run: pwsh -NoProfile -File scripts/verify-vsix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-workflow-designer-vsix
          path: artifacts/*.vsix
          if-no-files-found: error
